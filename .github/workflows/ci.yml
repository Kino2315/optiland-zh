name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# 同一分支连续推送时，取消上一次还没跑完的任务
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: 测试 ${{ matrix.os }} / py${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Windows 是主要在用的平台（PySide6 的坑在 Windows 上最多），
        # Linux 保证它没被写死成只在 Windows 能跑。
        os: [ubuntu-latest, windows-latest]
        # 只测两端：3.10 是 requires-python 的下界，3.13 是稳定版。
        # 中间版本由这两个端点的交集覆盖，全测是浪费 CI 额度。
        python-version: ["3.10", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      # 无头环境下 Qt 需要这些系统库，否则 import PySide6 就会失败
      - name: 安装 Qt 运行库（仅 Linux）
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libegl1 libgl1 libxkbcommon0 libdbus-1-3 libfontconfig1

      - name: 安装本项目与测试依赖
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          # PySide6 是运行期依赖，由 optiland[gui] 提供。
          # 测试引擎补丁必须要有它，但没必要把整个 optiland 拖进来
          # （VTK 一百多 MB，而测试根本不碰 3D）。
          pip install "PySide6>=6.5"

      - name: 跑测试
        # tests 里会自己设 QT_QPA_PLATFORM=offscreen；
        # 这里再显式给一次，避免某些 runner 上被外部环境影响。
        env:
          QT_QPA_PLATFORM: offscreen
        run: pytest -q

  catalog:
    name: 词库体检
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      # 词库是纯数据，不需要 Qt。这一步跑得飞快，而且它是这个项目
      # 最核心的资产 —— 一条格式写错的词条会让用户界面上出现半中半英。
      - name: 校验词库
        run: |
          pip install -e .
          python -m pytest tests/test_catalog.py -q -k "Catalog or Integrity or Pattern"

  build:
    name: 打包并校验产物
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - run: python -m pip install --upgrade build twine
      - run: python -m build
      - run: python -m twine check dist/*

      # 这条是给"词库没打进 wheel"上的保险。
      # 打包配置一旦被改动（换构建后端、改 package-data），
      # 最容易坏的就是这一条，而它坏了的表现是"装完没中文"，
      # 本地开发时完全发现不了 —— 因为开发环境里源码目录还在。
      - name: 确认词库确实在 wheel 里
        run: |
          python - <<'PY'
          import glob, sys, zipfile

          wheels = glob.glob("dist/*.whl")
          assert wheels, "没有产出 wheel"
          names = zipfile.ZipFile(wheels[0]).namelist()
          catalogs = [n for n in names if n.endswith(".json") and "catalogs/" in n]
          assert catalogs, f"wheel 里没有词库，装完会没中文。内容: {names}"
          print(f"OK  {wheels[0]} 里的词库: {catalogs}")
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
